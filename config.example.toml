# garbo — copia este archivo a ~/.config/garbo/config.toml
# Todo es opcional. Recarga en caliente con Ctrl+Shift+R.

# Temas incluidos: garbo-black, garbo-dark, garbo-light, tokyo-night, catppuccin-mocha, gruvbox-dark, nord
# Y además: grafito, abisal, fosforo, bosque, niebla, ciruela, papel, neon, duna, glaciar, tinta y
# cobalto, cada uno con su propia forma (pestañas, prompt, bloques…).
theme = "garbo-black"

[font]
family = "Adwaita Mono"     # si no existe se usa la monoespaciada del sistema
size = 11.0                  # puntos (como GNOME Terminal; en Windows, 10)
line_height = 1.0            # 1.0 = interlineado natural de la fuente
ui_family = ""               # fuente de la interfaz; vacía = Adwaita Sans (o la del sistema) con la interfaz
                             # Flotante y la del terminal con la Clásica
ui_size = 10.5               # en Windows, 9.5
# Se buscan en orden cuando la fuente principal no tiene un carácter.
# Solo se abren (mmap) cuando realmente hacen falta.
fallback = ["JetBrains Mono", "Noto Sans Mono", "Symbols Nerd Font Mono", "Noto Sans Mono CJK SC", "Noto Color Emoji", "Noto Emoji"]

[window]
padding = 10
opacity = 1.0          # < 1.0 = fondo translúcido (se puede cambiar en vivo desde Ajustes)
decorations = false   # false = pestañas integradas en la barra de título
columns = 110
lines = 32
always_show_tabs = true

[shell]
# program = "/usr/bin/fish"
# args = ["-l"]
# env = { EDITOR = "nvim" }

[terminal]
scrollback = 10000
cursor_style = "block"   # block | beam | underline | hollow
cursor_blink = false     # sin parpadeo = cero despertares cuando está inactiva
scroll_multiplier = 3.0
copy_on_select = false
shell_integration = true # bash: marcas de comando para los bloques (no toca tu ~/.bashrc)
blocks = true            # dibujar bloques: separadores, estado, duración
garbo_prompt = true      # prompt de Garbo: carpeta como etiqueta y comandos en negrita (pestañas nuevas)
ssh_integration = true   # ssh y mosh abren el shell del servidor con Garbo, sin instalar nada (Linux)
autosuggest = true       # sugerir en gris el resto del comando (→ lo acepta, Ctrl+→ palabra a palabra)
tab_key = "menu"         # menu: Tab abre el menú de completado | accept: Tab acepta la sugerencia
complete_as_you_type = false # abrir el menú de completado solo, mientras se escribe

# Avisos del escritorio cuando un agente termina
[notifications]
agents = "unfocused"     # unfocused: si no estás viendo su pestaña | always | never
min_work_secs = 5        # solo si trabajó al menos estos segundos
sound = true
blocked = true           # avisar también cuando un agente espera tu permiso o tu respuesta

# Pestañas. También en Ajustes → Pestañas.
[tabs]
# position = "top"       # top | bottom | left | right: borde de la ventana en el que van
# width    = "normal"    # narrow | normal | wide | max: lo más que mide cada pestaña (o la columna, a un lado)
# align    = "left"      # left | center: dónde va el nombre dentro de la pestaña
# working  = "dots"      # dots | wave | pulse | spin | bar | still: animación mientras trabaja un agente

# Forma de la interfaz. Cada tema trae la suya; aquí se cambia opción a opción. Lo más cómodo es el editor de aspecto: Ajustes → Tema → Aspecto, o "Editar el aspecto"
# en la paleta de comandos (Ctrl+Shift+P).
[style]
# interface  = "floating"  # floating (Flotante: terminal y paneles como tarjetas) | classic (la de siempre).
#                           # Con Flotante, los temas sin forma propia usan pill, round, chips y radio 10.
# tabs       = "flat"      # flat | underline | topline | pill | outline | floating | folder | brackets | segmented | dot
# prompt     = "border"    # border | soft | solid | tab | underline | brackets | dimmed | plain
# blocks     = "classic"   # classic | bar | dot | card | chips | outline | header | separator | dashed | status | errors | fade | none
# buttons    = "round"     # round | color | flat | icons (en Windows, flat por defecto)
# bar        = "normal"    # compact | normal | tall
# background = "solid"     # solid | gradient
# radius     = 6           # radio de las esquinas en píxeles
# block_gap  = 0           # hueco entre la salida anterior y la línea que separa los bloques, en píxeles (0-32)
# line_gap   = 0           # hueco entre esa línea y la ruta, en píxeles (0-32); sin línea, se suman los dos
# prompt_gap = 0           # hueco entre la ruta y el comando (prompt de Garbo), en píxeles (0-32)
# output_gap = 0           # hueco entre el comando y su salida, en píxeles (0-32)

# Sobrescribe colores del tema elegido
[colors]
