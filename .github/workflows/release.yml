name: Release

# Al subir una etiqueta vX.Y.Z al repositorio público se compilan el RPM (en Fedora), el .deb
# (en Ubuntu 22.04) y el instalador y la versión portátil de Windows, y se publican en la release. La app consulta estas releases para avisar de
# versiones nuevas. La release se crea como borrador y solo se publica cuando están todos
# los paquetes: la app nunca ve una a medias (los borradores no cuentan como la última).
# También se puede lanzar a mano para una etiqueta existente (Actions → Release → Run workflow).
# Este flujo tiene permiso de escritura y sus paquetes se instalan como root: solo usa la CLI
# oficial de GitHub (gh) y Actions fijadas a un commit concreto.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente a publicar (p. ej. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  draft:
    if: github.repository == 'garbanhh/garbo'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Crear la release como borrador
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Garbo ${TAG#v}" --generate-notes

  rpm:
    needs: draft
    runs-on: ubuntu-latest
    container: fedora:45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GARBO_RPM_PUBLIC_KEY: ${{ vars.GARBO_RPM_PUBLIC_KEY }}
    steps:
      - name: Dependencias
        run: dnf install -y gcc git gh rust cargo rpm-build rpm-sign gnupg2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Comprobar versión
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$VERSION" = "$TAG" || { echo "La etiqueta $TAG no coincide con Cargo.toml ($VERSION)"; exit 1; }
      - name: Herramienta de empaquetado
        run: cargo install cargo-generate-rpm --version 0.21.1 --locked
      - name: Compilar
        run: cargo build --release --locked
      - name: Generar RPM
        run: ~/.cargo/bin/cargo-generate-rpm
      - name: Firmar RPM
        env:
          GARBO_RPM_SIGNING_KEY: ${{ secrets.GARBO_RPM_SIGNING_KEY }}
        run: |
          if [ -z "$GARBO_RPM_PUBLIC_KEY" ] && [ -z "$GARBO_RPM_SIGNING_KEY" ]; then
            echo 'Publicación para instalación manual. La firma de RPM aún no está configurada.'
            exit 0
          fi
          test -n "$GARBO_RPM_PUBLIC_KEY" && test -n "$GARBO_RPM_SIGNING_KEY" || {
            echo 'Configura GARBO_RPM_PUBLIC_KEY y GARBO_RPM_SIGNING_KEY juntas.'
            exit 1
          }
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          export GNUPGHOME="$work/gnupg"
          mkdir "$GNUPGHOME" "$work/rpmdb"
          printf '%s\n' "$GARBO_RPM_PUBLIC_KEY" > "$work/garbo.asc"
          printf '%s\n' "$GARBO_RPM_SIGNING_KEY" | gpg --batch --import
          key=$(gpg --batch --show-keys --with-colons "$work/garbo.asc" | awk -F: '$1 == "fpr" && !seen++ { print $10 }')
          test -n "$key"
          rpmsign --define "_openpgp_sign_id $key" --addsign target/generate-rpm/*.rpm
          rpmkeys --noplugins --define '_keyring rpmdb' --dbpath "$work/rpmdb" --import "$work/garbo.asc"
          rpmkeys --noplugins --define '_keyring rpmdb' --dbpath "$work/rpmdb" \
            --define '_pkgverify_level all' --checksig target/generate-rpm/*.rpm
      - name: Calcular SHA-256
        run: |
          cd target/generate-rpm
          for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - name: Subir a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" target/generate-rpm/*.rpm target/generate-rpm/*.rpm.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  deb:
    needs: draft
    # La más antigua admitida: el binario pide la glibc de Ubuntu 22.04 (2.35), que también cumplen
    # Debian 12 y todas las versiones posteriores. Cuando GitHub retire esta imagen, ubuntu-24.04
    # (glibc 2.39) deja fuera a Ubuntu 22.04 y Debian 12.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GARBO_RPM_PUBLIC_KEY: ${{ vars.GARBO_RPM_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - name: Comprobar versión
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$VERSION" = "$TAG" || { echo "La etiqueta $TAG no coincide con Cargo.toml ($VERSION)"; exit 1; }
      - name: Herramienta de empaquetado
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Compilar y generar .deb
        run: cargo deb --locked
      - name: Firmar .deb
        env:
          GARBO_RPM_SIGNING_KEY: ${{ secrets.GARBO_RPM_SIGNING_KEY }}
        run: |
          if [ -z "$GARBO_RPM_PUBLIC_KEY" ] && [ -z "$GARBO_RPM_SIGNING_KEY" ]; then
            echo 'Publicación para instalación manual. La firma aún no está configurada.'
            exit 0
          fi
          test -n "$GARBO_RPM_PUBLIC_KEY" && test -n "$GARBO_RPM_SIGNING_KEY" || {
            echo 'Configura GARBO_RPM_PUBLIC_KEY y GARBO_RPM_SIGNING_KEY juntas.'
            exit 1
          }
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          export GNUPGHOME="$work/gnupg"
          mkdir "$GNUPGHOME"
          printf '%s\n' "$GARBO_RPM_SIGNING_KEY" | gpg --batch --import
          printf '%s\n' "$GARBO_RPM_PUBLIC_KEY" > "$work/garbo.asc"
          key=$(gpg --batch --show-keys --with-colons "$work/garbo.asc" | awk -F: '$1 == "fpr" && !seen++ { print $10 }')
          test -n "$key"
          # Firma aparte (.sig) y comprobación con gpgv y solo la clave pública, como hace la app.
          gpg --batch --dearmor < "$work/garbo.asc" > "$work/garbo.gpg"
          for f in target/debian/*.deb; do
            gpg --batch --yes --local-user "$key" --detach-sign --output "$f.sig" "$f"
            gpgv --keyring "$work/garbo.gpg" "$f.sig" "$f"
          done
      - name: Calcular SHA-256
        run: |
          cd target/debian
          for f in *.deb; do sha256sum "$f" > "$f.sha256"; done
          ls -la
          dpkg-deb --info *.deb
      - name: Subir a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" target/debian/*.deb target/debian/*.deb.sha256 \
            $(ls target/debian/*.deb.sig 2>/dev/null) --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: draft
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GARBO_RPM_PUBLIC_KEY: ${{ vars.GARBO_RPM_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - name: Comprobar versión
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$VERSION" = "$TAG" || { echo "La etiqueta $TAG no coincide con Cargo.toml ($VERSION)"; exit 1; }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      # Instalador y portátil con la ConPTY de Windows Terminal, firmados si están los secretos
      # GARBO_WINDOWS_CERT (el .pfx en base64) y GARBO_WINDOWS_CERT_PASSWORD.
      - name: Compilar, empaquetar y firmar
        shell: pwsh
        env:
          GARBO_WINDOWS_CERT: ${{ secrets.GARBO_WINDOWS_CERT }}
          GARBO_WINDOWS_CERT_PASSWORD: ${{ secrets.GARBO_WINDOWS_CERT_PASSWORD }}
        run: ./scripts/instalador.ps1
      - name: Subir a la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem target/windows -File | ForEach-Object { $_.FullName }
          gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber

  publish:
    needs: [rpm, deb, windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publicar la release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
