[package]
name = "garbo"
version = "0.11.1"
edition = "2021"
description = "Terminal GPU ligera, rápida y personalizable con pestañas y bloques de comandos"
license = "MIT"
repository = "https://github.com/garbanhh/garbo"
readme = "README.md"
keywords = ["terminal", "gpu", "wgpu", "tabs"]
categories = ["command-line-utilities"]

[dependencies]
# Núcleo de emulación VT (parser + grid + PTY), el mismo que usa Alacritty
alacritty_terminal = "0.26"
memchr = "2"
# Hash rápido para las cachés de glifos (ya está en el árbol vía naga)
rustc-hash = "1.1"
# Clave de firma en armadura ASCII a binario para gpgv (ya está en el árbol vía alacritty_terminal)
base64 = "0.22"
polling = "3"
# Ventana y eventos
winit = "0.30"
# Render GPU (Vulkan/Metal/DX12/GL)
wgpu = { version = "25", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# Fuentes: descubrimiento + rasterizado (Rust puro, sin freetype)
fontdb = { version = "0.24", features = ["memmap"] }
swash = "0.2"
memmap2 = "0.9"
# Emoji a color COLRv1 (ya están en el árbol de dependencias vía swash y winit)
skrifa = "0.44"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Portapapeles (Wayland nativo vía smithay-clipboard + X11)
copypasta = "0.10"
# Configuración
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
toml_edit = "0.25.19"
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Traer la ventana al frente al pulsar un aviso (xdg-activation); ya están en el árbol vía winit
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Windows: procesos de cada pestaña, puertos, portapapeles y ventana (ya está en el árbol vía
# polling, miow y dirs). Solo las API necesarias, sin el crate `windows` (COM/WinRT) completo.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Avisos del escritorio (notificaciones de Windows, WinRT). La misma versión que ya trae wgpu (DX12):
# solo se compilan estos módulos.
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
] }
# Comprimir las capturas que llegan como mapa de bits al pegarlas (PNG). Rust puro.
miniz_oxide = "0.8"

# Icono y datos de versión de garbo.exe (recurso de Windows, ver build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Empaquetado RPM con `cargo generate-rpm` (ver .github/workflows/release.yml)
[package.metadata.generate-rpm]
summary = "Terminal ligera con pestañas y bloques de comandos"
assets = [
    { source = "target/release/garbo", dest = "/usr/bin/garbo", mode = "755" },
    { source = "packaging/io.github.garbanhh.Garbo.desktop", dest = "/usr/share/applications/io.github.garbanhh.Garbo.desktop", mode = "644" },
    { source = "packaging/io.github.garbanhh.Garbo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.garbanhh.Garbo.svg", mode = "644" },
    { source = "packaging/io.github.garbanhh.Garbo.metainfo.xml", dest = "/usr/share/metainfo/io.github.garbanhh.Garbo.metainfo.xml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/garbo/LICENSE", mode = "644", doc = true },
    { source = "NOTICE", dest = "/usr/share/licenses/garbo/NOTICE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/garbo/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
curl = "*"
# notify-send (avisos)
libnotify = "*"

# Pegar imágenes en Wayland (wl-paste)
[package.metadata.generate-rpm.recommends]
wl-clipboard = "*"

# Paquete .deb con `cargo deb` (Debian y Ubuntu; ver .github/workflows/release.yml)
[package.metadata.deb]
maintainer = "garbanhh <336566837+garbanhh@users.noreply.github.com>"
copyright = "2026, garbanhh"
license-file = ["LICENSE", "0"]
extended-description = """\
Terminal para Linux acelerada por GPU, con pestañas, paneles divididos, bloques de comandos, \
sugerencias y completado, y seguimiento de agentes de código. Escrita en Rust."""
section = "x11"
priority = "optional"
# El binario solo enlaza libc ($auto). Wayland, X11, xkbcommon y Vulkan (u OpenGL) se abren al
# arrancar; curl y notify-send los usan el actualizador y los avisos.
depends = "$auto, curl, libnotify-bin, libvulkan1 | libegl1, libwayland-client0, libxkbcommon0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libxkbcommon-x11-0"
# Controladores Vulkan, pegar imágenes en Wayland, y verificar e instalar actualizaciones.
recommends = "mesa-vulkan-drivers, wl-clipboard, pkexec | policykit-1, gpgv"
assets = [
    ["target/release/garbo", "usr/bin/", "755"],
    ["packaging/io.github.garbanhh.Garbo.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.garbanhh.Garbo.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/io.github.garbanhh.Garbo.metainfo.xml", "usr/share/metainfo/", "644"],
    ["NOTICE", "usr/share/doc/garbo/", "644"],
    ["README.md", "usr/share/doc/garbo/", "644"],
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
