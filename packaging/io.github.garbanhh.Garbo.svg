<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b303d"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dbcff"/>
      <stop offset="1" stop-color="#6b8bf0"/>
    </linearGradient>
  </defs>
  <!-- sombra -->
  <rect x="10" y="14" width="108" height="104" rx="24" fill="#000" opacity="0.28"/>
  <!-- cuerpo -->
  <rect x="10" y="10" width="108" height="104" rx="24" fill="url(#bg)"/>
  <rect x="10.75" y="10.75" width="106.5" height="102.5" rx="23.25" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="1.5"/>
  <!-- barras de bloque (verde = bien, azul = activo) -->
  <rect x="24" y="30" width="5" height="20" rx="2.5" fill="#8fd18b"/>
  <rect x="24" y="58" width="5" height="34" rx="2.5" fill="url(#accent)"/>
  <!-- prompt y cursor -->
  <path d="M42 62 L58 75 L42 88" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="82" width="30" height="8" rx="4" fill="#e6e8ee"/>
  <!-- línea de salida anterior -->
  <rect x="42" y="36" width="44" height="7" rx="3.5" fill="#e6e8ee" opacity="0.35"/>
</svg>
